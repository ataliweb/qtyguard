name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable zip
        run: |
          mkdir -p build/qtyguard
          rsync -a --exclude-from=.distignore ./ build/qtyguard/
          cd build && zip -r ../qtyguard.zip qtyguard
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" qtyguard.zip --title "${GITHUB_REF_NAME}" --generate-notes
